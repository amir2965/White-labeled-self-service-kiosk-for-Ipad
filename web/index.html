<!DOCTYPE html>
<html>
<head>
  <!--
    The base href is derived from the page location so the same build works under any
    sub-path (e.g. GitHub Pages project sites serving the demo from /<repo>/app/).
  -->
  <script>document.write('<base href="' + location.pathname.replace(/[^/]*$/, '') + '">');</script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Self-Service Kiosk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Self-Service Kiosk</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="boot" style="position:fixed;inset:0;display:grid;place-items:center;background:#fff;z-index:1">
    <div style="width:34px;height:34px;border-radius:50%;border:3px solid #e5e7eb;border-top-color:#007aff;animation:boot-spin .8s linear infinite"></div>
  </div>
  <style>@keyframes boot-spin{to{transform:rotate(360deg)}}html,body{margin:0;background:#fff;overflow:hidden;height:100%}</style>
  <script>
    // Tell the embedding page (project website) once Flutter has painted its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b) b.remove();
      if (window.parent !== window) window.parent.postMessage({ type: 'kiosk-demo-ready' }, '*');
    });
    // Esc hands scrolling back to the embedding page.
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && window.parent !== window) window.parent.postMessage({ type: 'kiosk-demo-release' }, '*');
    }, true);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
